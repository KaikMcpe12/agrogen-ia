# nginx.conf — AgroGen IA
# Proxy reverso simples: unifica frontend e backend na porta 80

server {
    listen 80;

    # Aumentar limite para upload de CSV
    client_max_body_size 10M;

    # Requisições para a API → backend FastAPI.
    # O backend registra as rotas na raiz (API_V1=""), então a barra final no proxy_pass
    # remove o prefixo /api/v1/ usado pelo frontend: /api/v1/auth/login → /auth/login.
    location /api/v1/ {
        proxy_pass         http://backend:8000/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Timeout maior para geração de PDF e relatórios
        proxy_read_timeout 60s;
    }

    # Tudo o mais → frontend React (SPA)
    location / {
        proxy_pass         http://frontend:80;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
    }
}
