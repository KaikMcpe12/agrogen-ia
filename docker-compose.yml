version: "3.9"

# AgroGen IA — Docker Compose (com Nginx como proxy reverso)
# Nginx unifica tudo em uma porta (80):
#   /api/v1/* → backend:8000
#   /*         → frontend:3000
# Benefício: sem CORS (tudo no mesmo domínio/porta)

services:

  postgres:
    image: postgres:15-alpine
    container_name: agrogen_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-agrogen}
      POSTGRES_USER:     ${POSTGRES_USER:-agrogen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agrogen123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agrogen}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agrogen_backend
    restart: unless-stopped
    environment:
      DATABASE_URL:    postgresql+asyncpg://${POSTGRES_USER:-agrogen}:${POSTGRES_PASSWORD:-agrogen123}@postgres:5432/${POSTGRES_DB:-agrogen}
      JWT_SECRET_KEY:  ${JWT_SECRET_KEY:-dev_secret_troque_em_producao}
      APP_ENV:         ${APP_ENV:-development}
    depends_on:
      postgres:
        condition: service_healthy
    # Sem expose de porta — apenas o Nginx acessa

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # URL relativa — o Nginx roteia para o backend
        VITE_API_BASE_URL: /api/v1
    container_name: agrogen_frontend
    restart: unless-stopped
    depends_on:
      - backend
    # Sem expose de porta — apenas o Nginx acessa

  nginx:
    image: nginx:1.25-alpine
    container_name: agrogen_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
