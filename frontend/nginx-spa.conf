# frontend/nginx-spa.conf
# Necessário para o React Router funcionar:
# qualquer rota (ex: /animais/uuid) serve o index.html

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Assets com hash no nome (gerados pelo Vite) — cache longo
    location ~* \.(js|css|woff2?|png|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Service Worker — sem cache
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA: todas as rotas servem o index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
