document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

mat('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Sora';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"44ebfac4-032c-40a9-8138-ccf07a7b9238\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Sora';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"42b9ace3-0cce-48e0-9897-eaac6a225874\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Sora';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"44ebfac4-032c-40a9-8138-ccf07a7b9238\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Sora';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"42b9ace3-0cce-48e0-9897-eaac6a225874\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Sora';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"44ebfac4-032c-40a9-8138-ccf07a7b9238\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Sora';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"42b9ace3-0cce-48e0-9897-eaac6a225874\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<script src=\"c70d6cc0-4a43-4bf6-b949-e16e8ac47b86\"><\u002Fscript>\n<script src=\"48a904a4-290e-4ab0-8b61-7064c522e24d\"><\u002Fscript>\n\n<style>\n  /* ============ TOKENS (same as app) ============ */\n  :root {\n    --green-900:#1B4332;--green-800:#245742;--green-700:#2D6A4F;--green-600:#40916C;--green-100:#D8E9DF;\n    --terra-900:#5C3A1F;--terra-700:#8B5E3C;--terra-500:#B98E6A;--terra-200:#E2D1BD;\n    --beige:#F5EFE6;--beige-dark:#EAE0CE;--bg:#FAFAFA;--surface:#FFFFFF;\n    --amber:#D4A017;--amber-soft:#F5E2A0;--amber-bg:#FBF4DC;\n    --danger:#B91C1C;--danger-bg:#FEE2E2;--warn:#B45309;--warn-bg:#FEF3C7;\n    --ok:#15803D;--ok-bg:#DCFCE7;\n    --ink:#1A1A1A;--ink-2:#3A3A3A;--ink-3:#6B6B6B;--ink-4:#9CA39D;\n    --line:#E6E3DC;--line-2:#D8D3C7;\n    --shadow-sm:0 1px 2px rgba(27,67,50,.06);--shadow-md:0 4px 14px rgba(27,67,50,.08);--shadow-lg:0 12px 40px rgba(27,67,50,.12);\n    --r-sm:8px;--r-md:12px;--r-lg:18px;--r-xl:24px;\n    --font-display:'Sora',system-ui,sans-serif;--font-body:'Inter',system-ui,sans-serif;--font-mono:'JetBrains Mono',monospace;\n  }\n  *{box-sizing:border-box;}\n  html,body{margin:0;padding:0;}\n  body{font-family:var(--font-body);background:#fff;color:var(--ink);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-print-color-adjust:exact;print-color-adjust:exact;}\n  h1,h2,h3,h4{font-family:var(--font-display);margin:0;color:var(--ink);letter-spacing:-.01em;}\n  h1{font-size:24px;font-weight:700;} h2{font-size:20px;font-weight:700;} h3{font-size:16px;font-weight:600;} h4{font-size:13px;font-weight:600;}\n  p{margin:0;}\n\n  /* PAGE SHEETS - fixed PPTX-friendly size (16:10-ish landscape) */\n  .page-sheet{\n    width:1280px; height:800px; padding:36px 44px;\n    background:#fff; box-shadow:0 4px 20px rgba(0,0,0,.06);\n    margin:14px auto; position:relative; overflow:hidden;\n    page-break-after:always; break-after:page;\n  }\n  .page-sheet:last-child{page-break-after:auto;break-after:auto;}\n\n  /* Doc cover */\n  .cover{\n    background:linear-gradient(135deg,var(--green-900) 0%,var(--green-700) 50%,var(--terra-700) 100%);\n    color:#fff;padding:80px 72px;\n    display:flex;flex-direction:column;justify-content:space-between;\n    position:relative;overflow:hidden;\n  }\n  .cover::before{\n    content:'';position:absolute;inset:0;\n    background:radial-gradient(circle at 80% 20%,rgba(212,160,23,.25),transparent 50%),radial-gradient(circle at 20% 80%,rgba(212,160,23,.15),transparent 50%);\n  }\n  .cover>*{position:relative;z-index:1;}\n  .cover .brand{display:flex;align-items:center;gap:14px;}\n  .cover .mark{width:54px;height:54px;border-radius:14px;background:linear-gradient(135deg,#fff,#F5E2A0);display:grid;place-items:center;color:var(--green-900);font-size:24px;font-weight:800;font-family:var(--font-display);}\n  .cover .brand-text{font-family:var(--font-display);font-weight:700;font-size:28px;letter-spacing:-.02em;}\n  .cover .brand-text .ia{color:var(--amber-soft);}\n  .cover h1{font-family:var(--font-display);font-size:60px;font-weight:800;line-height:1;letter-spacing:-.02em;margin-top:40px;color:#fff;}\n  .cover h1 .accent{color:var(--amber-soft);}\n  .cover .lead{font-size:18px;opacity:.9;max-width:680px;margin-top:18px;line-height:1.45;}\n  .cover .meta-line{display:flex;gap:50px;margin-top:60px;}\n  .cover .meta-line .item .lbl{font-size:11px;opacity:.7;text-transform:uppercase;letter-spacing:.06em;}\n  .cover .meta-line .item .val{font-family:var(--font-display);font-weight:700;font-size:18px;margin-top:4px;color:var(--amber-soft);}\n  .cover .ftr{font-size:12px;opacity:.7;display:flex;justify-content:space-between;align-items:flex-end;}\n  .cover .ftr .right{text-align:right;}\n\n  /* Section header on each page */\n  .sheet-head{\n    display:flex;align-items:center;justify-content:space-between;\n    padding-bottom:10px;border-bottom:2px solid var(--green-900);margin-bottom:18px;\n  }\n  .sheet-head .brand{display:flex;align-items:center;gap:8px;}\n  .sheet-head .brand .mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--green-900),var(--green-600));display:grid;place-items:center;color:var(--amber-soft);}\n  .sheet-head .brand .name{font-family:var(--font-display);font-weight:700;font-size:14px;}\n  .sheet-head .brand .name .ia{color:var(--amber);}\n  .sheet-head .page-label{font-family:var(--font-display);font-weight:600;font-size:14px;color:var(--ink-3);}\n  .sheet-head .pg-num{font-family:var(--font-mono);font-size:11px;color:var(--ink-3);}\n  \n  .sheet-title{margin-bottom:14px;}\n  .sheet-title .kicker{font-family:var(--font-display);font-size:11px;font-weight:600;color:var(--green-700);text-transform:uppercase;letter-spacing:.08em;}\n  .sheet-title h2{font-size:22px;font-weight:700;margin-top:2px;}\n  .sheet-title .sub{font-size:13px;color:var(--ink-3);margin-top:2px;}\n\n  /* CARDS */\n  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;}\n  .card-title{display:flex;align-items:center;gap:8px;margin-bottom:10px;}\n  .card-title h3{font-size:14px;}\n\n  /* Stats */\n  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px;}\n  .stat-card{padding:14px;}\n  .stat-card .stat-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}\n  .stat-card .label{color:var(--ink-3);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.04em;}\n  .stat-card .icon-pill{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;}\n  .stat-card .num{font-family:var(--font-display);font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1;}\n  .stat-card .meta{font-size:11px;color:var(--ink-3);margin-top:4px;}\n  .trend-up{color:var(--ok);font-weight:600;} .trend-down{color:var(--danger);font-weight:600;}\n\n  /* badges */\n  .badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;}\n  .badge-bovino{background:var(--green-100);color:var(--green-900);}\n  .badge-ovino{background:#DCEAFB;color:#1E4A8C;}\n  .badge-caprino{background:var(--terra-200);color:var(--terra-900);}\n  .badge-ok{background:var(--ok-bg);color:var(--ok);}\n  .badge-warn{background:var(--warn-bg);color:var(--warn);}\n  .badge-danger{background:var(--danger-bg);color:var(--danger);}\n  .badge-amber{background:var(--amber-bg);color:var(--warn);}\n  .badge-ghost{background:var(--beige);color:var(--ink-2);}\n\n  /* tables */\n  .table-wrap{overflow:hidden;border-radius:12px;border:1px solid var(--line);background:#fff;}\n  table.tbl{width:100%;border-collapse:collapse;font-size:12px;}\n  .tbl th,.tbl td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);}\n  .tbl th{background:var(--beige);font-weight:600;color:var(--ink-2);font-size:10px;text-transform:uppercase;letter-spacing:.04em;}\n  .tbl tbody tr:last-child td{border-bottom:0;}\n  .tbl .id-mono{font-family:var(--font-mono);font-size:10px;color:var(--ink-3);}\n\n  /* dash grid */\n  .dash-grid{display:grid;grid-template-columns:1.7fr 1fr;gap:12px;margin-bottom:14px;}\n  .chart-wrap{position:relative;height:160px;}\n\n  /* timeline */\n  .timeline{display:flex;flex-direction:column;gap:8px;}\n  .timeline-item{display:flex;gap:8px;align-items:flex-start;}\n  .timeline-dot{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex-shrink:0;}\n  .timeline-content .text{font-size:12px;color:var(--ink);}\n  .timeline-content .time{font-size:10px;color:var(--ink-3);margin-top:1px;}\n\n  /* AI */\n  .ai-tab-card{padding:14px;border:1.5px solid var(--line);border-radius:14px;display:flex;gap:10px;align-items:center;flex:1;}\n  .ai-tab-card.active{border-color:var(--green-700);background:var(--green-100);}\n  .ai-tab-card .ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--amber-bg);color:var(--warn);}\n  .ai-tab-card .ttl{font-weight:600;font-size:13px;}\n  .ai-tab-card .sub{font-size:11px;color:var(--ink-3);}\n\n  .gauge-wrap{display:flex;flex-direction:column;align-items:center;padding:8px;}\n  .gauge{position:relative;width:180px;height:180px;}\n  .gauge svg{transform:rotate(-90deg);}\n  .gauge-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}\n  .gauge-num .v{font-family:var(--font-display);font-size:42px;font-weight:700;line-height:1;}\n  .gauge-num .pct{font-size:14px;color:var(--ink-3);font-weight:600;}\n  .gauge-num .lbl{font-size:10px;color:var(--ink-3);margin-top:2px;}\n\n  .factor-list{display:flex;flex-direction:column;gap:6px;}\n  .factor{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--beige);border-radius:8px;font-size:12px;}\n  .recommendation{background:var(--amber-bg);border:1px solid var(--amber-soft);border-radius:12px;padding:12px;display:flex;gap:10px;align-items:flex-start;}\n  .recommendation .ttl{font-weight:600;color:var(--warn);margin-bottom:2px;font-size:12px;}\n  .recommendation .txt{color:var(--ink-2);font-size:12px;}\n\n  /* form-row utility */\n  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}\n  .form-row-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}\n  .col{display:flex;flex-direction:column;gap:8px;}\n  .row{display:flex;gap:10px;align-items:center;}\n\n  /* wizard stepper */\n  .stepper{display:flex;align-items:center;gap:0;margin-bottom:18px;}\n  .step-item{display:flex;align-items:center;gap:8px;flex:1;}\n  .step-circle{width:28px;height:28px;border-radius:50%;background:var(--beige);color:var(--ink-3);display:grid;place-items:center;font-weight:700;font-size:12px;border:2px solid var(--line);flex-shrink:0;}\n  .step-item.active .step-circle{background:var(--green-900);color:#fff;border-color:var(--green-900);}\n  .step-item.done .step-circle{background:var(--green-100);color:var(--green-900);border-color:var(--green-700);}\n  .step-label{font-size:11px;font-weight:500;color:var(--ink-3);}\n  .step-item.active .step-label{color:var(--ink);font-weight:600;}\n  .step-line{flex:1;height:2px;background:var(--line);margin:0 6px;}\n  .step-item.done + .step-line{background:var(--green-700);}\n\n  /* animal pick */\n  .animal-pick{display:flex;gap:10px;padding:10px;background:var(--beige);border-radius:10px;border:1px solid var(--line);align-items:center;}\n  .animal-pick .ava{width:38px;height:38px;border-radius:10px;background:var(--surface);display:grid;place-items:center;font-size:18px;flex-shrink:0;}\n  .animal-pick .info .name{font-weight:600;font-size:13px;}\n  .animal-pick .info .meta{font-size:11px;color:var(--ink-3);margin-top:2px;}\n\n  /* Avatar/profile */\n  .avatar-lg{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--green-900),var(--terra-700));color:#fff;display:grid;place-items:center;font-family:var(--font-display);font-size:28px;font-weight:700;margin:0 auto 10px;}\n\n  /* toggle pill display */\n  .toggle-pill{padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);text-align:center;font-weight:500;font-size:12px;color:var(--ink-2);}\n  .toggle-pill.active{border-color:var(--green-700);background:var(--green-100);color:var(--green-900);}\n\n  /* radio-cards */\n  .radio-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}\n  .radio-card{border:1.5px solid var(--line);border-radius:10px;padding:10px;text-align:center;background:var(--surface);}\n  .radio-card.active{border-color:var(--green-700);background:var(--green-100);}\n  .radio-card .emoji{font-size:22px;}\n  .radio-card .label{font-weight:600;font-size:12px;margin-top:2px;}\n\n  /* utility */\n  .text-muted{color:var(--ink-3);} .text-sm{font-size:12px;} .text-xs{font-size:11px;}\n  .section-block{border-top:1px solid var(--line);padding-top:12px;margin-top:12px;}\n  .section-block:first-child{border-top:0;padding-top:0;margin-top:0;}\n  .section-title{font-family:var(--font-display);font-weight:600;font-size:12px;color:var(--green-900);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px;display:flex;align-items:center;gap:6px;}\n  .filter-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:12px;}\n  .filter-row .input,.filter-row .select{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:12px;min-width:140px;}\n  .filter-row .grow{flex:1;}\n\n  /* Buttons-as-static */\n  .btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;font-weight:600;font-size:12px;line-height:1;}\n  .btn-primary{background:var(--green-900);color:#fff;}\n  .btn-amber{background:var(--amber);color:#2A1F00;}\n  .btn-secondary{background:#fff;border:1px solid var(--line);color:var(--ink-2);}\n  .btn-danger{background:var(--danger);color:#fff;}\n\n  /* Doc footer at bottom of each sheet */\n  .doc-foot{\n    position:absolute;left:44px;right:44px;bottom:24px;\n    display:flex;justify-content:space-between;align-items:center;\n    font-size:10px;color:var(--ink-3);\n    padding-top:6px;border-top:1px solid var(--line);\n  }\n\n  /* TOC */\n  .toc{margin-top:18px;}\n  .toc-item{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px dashed var(--line);}\n  .toc-item .n{width thout UI redirect)\n  AppState.currentUser = { nome: 'Maria Cavalcante', email: 'maria@agrogen.ce.gov.br', telefone: '(88) 9 9123-4567', cpf: '123.456.789-12', tipo: 'Técnico Agropecuário' };\n\n  // Capture: Login screen replica\n  buildLoginSheet();\n\n  // Capture: Dashboard\n  buildAppSheet('Dashboard principal', 'Visão geral do rebanho e desempenho reprodutivo', '03', '04 / 09', 'dashboard', { compact: true });\n\n  // Capture: Animais (list + a snapshot of the form too on the same page)\n  buildAnimaisSheet();\n\n  // Capture: Inseminação - mostrar wizard com passo 4 preenchido (review)\n  buildInseminacaoSheet();\n\n  // Capture: IA\n  buildAISheet();\n\n  // Capture: Relatorios\n  buildRelatoriosSheet();\n\n  // Capture: Perfil\n  buildPerfilSheet();\n\n  // Replace lucide icons\n  setTimeout(() => { lucide.createIcons(); window.__readyToPrint = true; }, 400);\n}\n\n/* --------- Builders --------- */\n\nfunction buildLoginSheet(){\n  const sheet = makeSheet('Login & Cadastro', 'Acesso à plataforma', '03 / 09', 'pag-login');\n  const body = document.createElement('div');\n  body.innerHTML = `\n    <div class=\"sheet-title\">\n      <div class=\"kicker\">Tela 01<\u002Fdiv>\n      <h2>Login & Cadastro<\u002Fh2>\n      <div class=\"sub\">Split-screen com hero motivacional à esquerda e formulário à direita. Suporta entrar e criar conta com validação inline.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"form-row\" style=\"grid-template-columns:1.1fr 1fr;gap:16px;align-items:stretch;\">\n      <div style=\"background:linear-gradient(135deg,var(--green-900) 0%,var(--green-700) 50%,var(--terra-700) 100%);color:#fff;border-radius:18px;padding:24px;position:relative;overflow:hidden;min-height:340px;display:flex;flex-direction:column;justify-content:space-between;\">\n        <div style=\"position:absolute;inset:0;background:radial-gradient(circle at 80% 20%,rgba(212,160,23,.25),transparent 50%),radial-gradient(circle at 20% 80%,rgba(212,160,23,.15),transparent 50%);\"> =\"padding:24px;display:flex;flex-direction:column;justify-content:center;\">\n        <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:18px;\">\n          <div style=\"width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--green-900),var(--green-600));color:var(--amber-soft);display:grid;place-items:center;\"><i data-lucide=\"dna\" style=\"width:18px;height:18px;\"><\u002Fi><\u002Fdiv>\n          <div style=\"font-family:var(--font-display);font-weight:700;font-size:16px;\">AgroGen <span style=\"color:var(--amber);\">IA<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;background:var(--beige);border-radius:10px;padding:3px;margin-bottom:18px;\">\n          <div style=\"flex:1;text-align:center;padding:8px;background:#fff;border-radius:8px;font-weight:600;font-size:12px;color:var(--green-900);box-shadow:var(--shadow-sm);\">Entrar<\u002Fdiv>\n          <div style=\"flex:1;text-align:center;padding:8px;font-weight:600;font-size:12px;color:var(--ink-3);\">Criar conta<\u002Fdiv>\n        <\u002Fdiv>\n        <h3 style=\"font-size:16px;margin-bottom:4px;\">Bem-vindo de volta<\u002Fh3>\n        <div class=\"text-sm text-muted\" style=\"margin-bottom:16px;\">Entre para acompanhar seu rebanho.<\u002Fdiv>\n        <label style=\"font-size:11px;font-weight:500;color:var(--ink-2);\">E-mail<\u002Flabel>\n        <div style=\"padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;margin:4px 0 12px;font-size:13px;color:var(--ink-3);\">maria@agrogen.ce.gov.br<\u002Fdiv>\n        <label style=\"font-size:11px;font-weight:500;color:var(--ink-2);\">Senha<\u002Flabel>\n        <div style=\"padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;margin:4px 0 12px;font-size:13px;color:var(--ink-3);\">••••••••••<\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:11px;\">\n          <span style= >Tela ${kicker}<\u002Fdiv><h2>${title}<\u002Fh2><div class=\"sub\">${subtitle}<\u002Fdiv>`;\n  sheet.appendChild(tw);\n  const holder = document.createElement('div');\n  holder.style.cssText = 'position:relative;';\n  sheet.appendChild(holder);\n  __renderAt(page, holder);\n  // Tame the captured page: remove the original .page-head buttons & inner page padding\n  holder.querySelectorAll('.page').forEach(p => { p.style.padding = '0'; p.style.maxWidth='none'; });\n  holder.querySelectorAll('.no-print').forEach(n => n.remove());\n  // strip interactive buttons in head row (we leave the title only)\n  appendFoot(sheet, pgnum.split('/')[0].trim());\n}\n\nfunction buildAnimaisSheet(){\n  const sheet = makeSheet('Módulo Animais', '', '05 / 09', 'pag-animais');\n  sheet.insertAdjacentHTML('beforeend', `\n    <div class=\"sheet-title\"><div class=\"kicker\">Tela 03<\u002Fdiv><h2>Módulo Animais<\u002Fh2><div class=\"sub\">Listagem com filtros, paginação e badges por espécie · formulário completo agrupado em 3 seções (Identificação, Genética, Reprodutivo).<\u002Fdiv><\u002Fdiv>\n  `);\n  const holder = document.createElement('div');\n  sheet.appendChild(holder);\n  __renderAt('animais', holder);\n  holder.querySelectorAll('.page').forEach(p => { p.style.padding='0'; p.style.maxWidth='none'; });\n  // Compress: only keep first 8 rows visible to fit page\n  const rows = holder.querySelectorAll('tbody tr');\n  rows.forEach((r,i)=>{ if(i>=7) r.remove(); });\n  // remove pagination buttons\n  const pg = holder.querySelector('#animais-pag'); if (pg) pg.innerHTML = '<span class=\"text-xs text-muted\">… 8 de 15 animais · paginação 1 2<\u002Fspan>';\n  appendFoot(sheet, '05');\n}\n\nfunction buildInseminacaoSheet(){\n  const sheet = makeSheet('Módulo Inseminação', '', '06 / 09', 'pag-insem');\n  sheet.insertAdjacentHTML('beforeend', `\n    <div class=\"sheet-title\"><div class=\"kicker\">Tela 04<\u002Fdiv><h2>Wizard de Inseminação<\u002Fh2><div class=\"sub\">Fluxo de 4 passos: selecionar animal → reprodutor/sêmen → dados do evento → revisão e confirmação.<\u002Fdiv><\u002Fdiv>\n  `);\n  // Simulate step 4 (review) - prepare draft\n  const a = AppState.animais.find(x => x.id === 'BOV-001');\n  AppState.insemDraft.animalId = 'BOV-001';\n  AppState.insemDraft.tipo = 'IATF';\n  AppState.insemDraft.reprodutor = 'Trovão (BOV-002)';\n  AppState.insemDraft.palheta = 'P-238 · Lote 04';\n  AppState.insemDraft.tecnico = 'João Silva';\n  AppState.insemDraft.data = new Date().toISOString().slice(0,16);\n  AppState.insemDraft.fase = 'Protocolo IATF 9 dias — CIDR + Benzoato de estradiol';\n  AppState.insemDraft.condicao = 4;\n  AppState.insemDraft.temperatura = 29.5;\n  AppState.insemDraft.observacoes = 'Procedimento sem intercorrências. Cio com sinais claros, muco filante presente.';\n  AppState.insemStep = 4;\n  const holder = document.createElement('div');\n  sheet.appendChild(holder);\n  __renderAt('inseminacao', holder);\n  holder.querySelectorAll('.page').forEach(p => { p.style.padding='0'; p.style.maxWidth='none'; });\n  // Also append a mini summary of history below\n  const hist = document.createElement('div');\n  hist.style.marginTop = '14px';\n  hist.innerHTML = `\n    <h4 style=\"margin-bottom:8px;\">Histórico de inseminações (extrato)<\u002Fh4>\n    <div class=\"table-wrap\">\n      <table class=\"tbl\">\n        <thead><tr><th>Animal<\u002Fth><th>Reprodutor<\u002Fth><th>Data<\u002Fth><th>Técnico<\u002Fth><th>Resultado<\u002Fth><\u002Ftr><\u002Fthead>\n        <tbody>${AppState.inseminacoes.slice(0,5).map(i => {\n          const an = AppState.animais.find(x=>x.id===i.animalId);\n          const badge = i.resultado==='Prenha'?'badge-ok':i.resultado==='Falha'?'badge-danger':'badge-warn';\n          return `<tr><td><strong>${an?.nome||i.animalId}<\u002Fstrong><\u002Ftd><td>${i.reprodutor}<\u002Ftd><td>${new Date(i.data).toLocaleDateString('pt-BR')}<\u002Ftd><td>${i.tecnico}<\u002Ftd><td><span class=\"badge ${badge}\">${i.resultado}<\u002Fspan><\u002F style=\"margin-bottom:14px;\">\n      <div class=\"ava\">${ESPECIE_EMOJI[animal.especie]}<\u002Fdiv>\n      <div class=\"info\">\n        <div class=\"name\">${animal.nome} <span class=\"id-mono\" style=\"color:var(--ink-3);\">${animal.id}<\u002Fspan><\u002Fdiv>\n        <div class=\"meta\">${renderBadgeEspecie(animal.especie)} · ${animal.raca} · CC ${animal.condicaoCorporal}/5 · ${AppState.inseminacoes.filter(i=>i.animalId===animal.id).length} eventos no histórico<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"form-row\" style=\"grid-template-columns:0.8fr 1.2fr;gap:14px;\">\n      <div style=\"background:var(--beige);border-radius:14px;padding:12px;\">\n        <div id=\"gauge-pdf\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <h4 style=\"margin-bottom:8px;\">Fatores que influenciaram<\u002Fh4>\n        <div class=\"factor-list\">\n          ${factors.map(f => `<div class=\"factor\"><i data-lucide=\"${f.tipo==='pos'?'check-circle-2':f.tipo==='neg'?'x-circle':'alert-triangle'}\" style=\"width:14px;height:14px;color:${f.tipo==='pos'?'var(--ok)':f.tipo==='neg'?'var(--danger)':'var(--amber)'};\"><\u002Fi><div>${f.txt}<\u002Fdiv><\u002Fdiv>`).join('')}\n        <\u002Fdiv>\n        <div class=\"recommendation\" style=\"margin-top:10px;\">\n          <i data-lucide=\"lightbulb\" style=\"width:14px;height:14px;color:var(--warn);margin-top:2px;\"><\u002Fi>\n          <div><div class=\"ttl\">Recomendação da IA<\u002Fdiv><div class=\"txt\">${rec}<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  `;\n  sheet.appendChild(out);\n  // small recap of other two AI modes\n  const recap = document.createElement('div');\n  recap.style.cssText = 'display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;';\n  recap.innerHTML = `\n    <div class=\"card\" style=\"padding:12px;\"><h4 style=\"margin-bottom:4px;\">Padrões de fertilidade<\u002Fh4><div class=\"text-sm text-muted\">Identifica raça com maior/menor taxa, técnico de melhor desempenho, melhores meses para inseminação e CC ideal. Inclui ranking das matrizes do rebanho.<\u002Fdiv><\u002Fdiv>\n    <div class=\"card\" style=\"padding:12px;\"><h4 style=\"margin-bottom:4px;\">Seleção genética<\u002Fh4><div class=\"text-sm text-muted\">Score genético por cruzamento sugerido com base em objetivos (ganho de peso, precocidade, resistência ao calor, leite, prolificidade). Detecta consanguinidade.<\u002Fdiv><\u002Fdiv>\n  `;\n  sheet.appendChild(recap);\n  appendFoot(sheet, '07');\n  // draw gauge after attach\n  setTimeout(() => renderGaugePrenhez(result.score, out.querySelector('#gauge-pdf')), 50);\n}\n\nfunction buildRelatoriosSheet(){\n  const sheet = makeSheet('Relatórios', '', '08 / 09', 'pag-rel');\n  sheet.insertAdjacentHTML('beforeend', `\n    <div class=\"sheet-title\"><div class=\"kicker\">Tela 06<\u002Fdiv><h2>Módulo Relatórios<\u002Fh2><div class=\"sub\">Documento executivo com KPIs, distribuição de resultados, taxa por raça e tabela detalhada. Exportável em PDF e CSV.<\u002Fdiv><\u002Fdiv>\n  `);\n  // KPIs\n  const insems = AppState.inseminacoes;\n  const resolvidas = insems.filter(i => i.resultado !== 'Aguardando');\n  const prenhas = insems.filter(i => i.resultado === 'Prenha').length;\n  const taxa = resolvidas.length ? Math.round(prenhas/resolvidas.length*100) : 0;\n  const kpis = document.createElement('div');\n  kpis.className = 'stat-grid';\n  kpis.innerHTML = `\n    <div class=\"card stat-card\"><div class=\"stat-head\"><span class=\"label\">Inseminações<\u002Fspan><div class=\"icon-pill\" style=\"background:var(--green-100);color:var(--green-900);\"><i data-lucide=\"syringe\" style=\"width:14px;height:14px;\"><\u002Fi><\u002Fdiv><\u002Fdiv><div class=\"num\">${insems.length}<\u002Fdiv><div class=\"meta\">últimos 6 meses<\u002Fdiv><\u002Fdiv>\n    <div class=\"card stat-card\"><div class=\"stat-head\"><span class=\"label\">Taxa de prenhez<\u002Fspan><div class=\"icon-pill\" style=\"background:var(--ok-bg);color:var(--ok);\"><i data-lucide=\"trending-up\" style=\"width:14px;height:14px;\"><\u002Fi><\u002Fdiv><\u002Fdiv><div class=\"num\">${taxa}%<\u002Fdiv><div class=\"meta\">${prenhas} prenhas · ${resolvidas.length-prenhas} falhas<\u002Fdiv><\u002Fdiv>\n    <div class=\"card stat-card\"><div class=\"stat-head\"><span class=\"label\">Nascimentos previstos<\u002Fspan><div class=\"icon-pill\" style=\"background:var(--amber-bg);color:var(--warn);\"><i data-lucide=\"calendar-clock\" style=\"width:14px;height:14px;\"><\u002Fi><\u002Fdiv><\u002Fdiv><div class=\"num\">${prenhas}<\u002Fdiv><div class=\"meta\">próximos 9-11 meses<\u002Fdiv><\u002Fdiv>\n    <div class=\"card stat-card\"><div class=\"stat-head\"><span class=\"label\">Custo por prenhez<\u002Fspan><div class=\"icon-pill\" style=\"background:var(--terra-200);color:var(--terra-900);\"><i data-lucide=\"circle-dollar-sign\" style=\"width:14px;height:14px;\"><\u002Fi><\u002Fdiv><\u002Fdiv><div class=\"num\">R$ ${prenhas ? Math.round(insems.length*120/prenhas) : 0}<\u002Fdiv><div class=\"meta\">médio estimado<\u002Fdiv><\u002Fdiv>\n  `;\n  sheet.appendChild(kpis);\n  // Charts row\n  const chartRow = document.createElement('div');\n  chartRow.className = 'dash-grid';\n  chartRow.innerHTML = `\n    <div class=\"card\" style=\"padding:12px;\">\n      <h4 style=\"margin-bottom:6px;\">Distribuição de resultados<\u002Fh4>\n      <div style=\"height:170px;position:relative;\"><canvas id=\"rep-pie-pdf\"><\u002Fcanvas><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"card\" style=\"padding:12px;\">\n      <h4 style=\"margin-bottom:6px;\">Taxa por raça<\u002Fh4>\n      <div style=\"height:170px;position:relative;\"><canvas id=\"rep-bar-pdf\"><\u002Fcanvas><\u002Fdiv>\n    <\u002Fdiv>\n  `;\n  sheet.appendChild(chartRow);\n  // table\n  const tbl = document.createElement('div');\n  tbl.innerHTML = `\n    <h4 style=\"margin:8px 0;\">Eventos detalhados<\u002Fh4>\n    <div class=\"table-wrap\">\n      <table class=\"tbl\">\n        <thead><tr><th>Animal<\u002Fth><th>Espécie<\u002Fth><th>Raça<\u002Fth><th>Data<\u002Fth><th>Reprodutor<\u002Fth><th>Técnico<\u002Fth><th>Resultado<\u002Fth><\u002Ftr><\u002Fthead>\n        <tbody>${insems.slice(0,7).map(i => {\n          const an = AppState.animais.find(x=>x.id===i.animalId) || {};\n          const bg = i.resultado==='Prenha'?'background:rgba(21,128,61,.06);':i.resultado==='Falha'?'background:rgba(185,28,28,.06);':'background:rgba(212,160,23,.06);';\n          const badge = i.resultado==='Prenha'?'badge-ok':i.resultado==='Falha'?'badge-danger':'badge-warn';\n          return `<tr style=\"${bg}\"><td><strong>${an.nome||i.animalId}<\u002Fstrong><\u002Ftd><td>${an.especie?renderBadgeEspecie(an.especie):'—'}<\u002Ftd><td>${an.raca||'—'}<\u002Ftd><td>${new Date(i.data).toLocaleDateString('pt-BR')}<\u002Ftd><td>${i.reprodutor}<\u002Ftd><td>${i.tecnico}<\u002Ftd><td><span class=\"badge ${badge}\">${i.resultado}<\u002Fspan><\u002Ftd><\u002Ftr>`;\n        }).join('')}<\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fdiv>`;\n  sheet.appendChild(tbl);\n  appendFoot(sheet, '08');\n  setTimeout(() => {\n    const aguar = insems.length - resolvidas.length;\n    const falhas = resolvidas.length - prenhas;\n    new Chart(document.getElementById('rep-pie-pdf'), {\n      type:'doughnut',\n      data:{labels:['Prenha','Falha','Aguardando'],datasets:[{data:[prenhas,falhas,aguar],backgroundColor:['#15803D','#B91C1C','#D4A017'],borderWidth:0}]},\n      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{color:'#3A3A3A',font:{size:10}}}},cutout:'60%',animation:false}\n    });\n    const racas = {};\n    resolvidas.forEach(i => { const a = AppState.animais.find(x=>x.id===i.animalId); if (!a) return; racas[a.raca] = racas[a.raca] || {total:0,prenha:0}; racas[a.raca].total++; if (i.resultado==='Prenha') racas[a.raca].prenha++; });\n    const lbl = Object.keys(racas); const data = lbl.map(r => Math.round(racas[r].prenha/racas[r].total*100));\n    new Chart(document.getElementById('rep-bar-pdf'), {\n      type:'bar',\n      data:{labels:lbl,datasets:[{data,backgroundColor:'rgba(45,106,79,.85)',borderRadius:6}]},\n      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},animation:false,scales:{x:{ticks:{color:'#3A3A3A',font:{size:10}},grid:{color:'#E6E3DC'}},y:{beginAtZero:true,max:100,ticks:{color:'#3A3A3A',font:{size:10},callback:v=>v+'%'},grid:{color:'#E6E3DC'}}}}\n    });\n  }, 80);\n}\n\nfunction buildPerfilSheet(){\n  const sheet = makeSheet('Perfil & LGPD', '', '09 / 09', 'pag-perfil');\n  const u = AppState.currentUser;\n  const initials = u.nome.split(' ').map(s=>s[0]).slice(0,2).join('').toUpperCase();\n  sheet.insertAdjacentHTML('beforeend', `\n    <div class=\"sheet-title\"><div class=\"kicker\">Tela 07<\u002Fdiv><h2>Perfil do Produtor & LGPD<\u002Fh2><div class=\"sub\">Dados pessoais, fazendas associadas, preferências de notificação e direitos do titular (Lei nº 13.709/2018).<\u002Fdiv><\u002Fdiv>\n    <div class=\"form-row\" style=\"grid-template-columns:1fr 1.6fr;gap:14px;align-items:start;\">\n      <div class=\"card\" style=\"text-align:center;padding:18px;\">\n        <div class=\"avatar-lg\">${initials}<\u002Fdiv>\n        <h3>${u.nome}<\u002Fh3>\n        <div class=\"text-sm text-muted\">${u.email}<\u002Fdiv>\n        <div style=\"margin-top:10px;\"><span class=\"badge badge-bovino\">${u.tipo}<\u002Fspan><\u002Fdiv>\n        <div class=\"section-block\" style=\"text-align:left;\">\n          <div class=\"section-title\">Dados de contato<\u002Fdiv>\n          <div class=\"text-xs text-muted\">CPF<\u002Fdiv><div style=\"font-family:var(--font-mono);font-weight:600;\">***.***.***-12<\u002Fdiv>\n          <div class=\"text-xs text-muted\" style=\"margin-top:6px;\">Telefone<\u002Fdiv><div style=\"font-weight:600;\">${u.telefone}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"col\" style=\"gap:10px;\">\n        <div class=\"card\">\n          <div class=\"section-title\">Fazendas associadas<\u002Fdiv>\n          <div class=\"table-wrap\">\n            <table class=\"tbl\">\n              <thead><tr><th>Nome<\u002Fth><th>Município<\u002Fth><th>Área (ha)<\u002Fth><th>Espécies<\u002Fth><\u002Ftr><\u002Fthead>\n              <tbody>\n                <tr><td><strong>Fazenda Boa Esperança<\u002Fstrong><\u002Ftd><td>Crateús/CE<\u002Ftd><td>320<\u002Ftd><td>${renderBadgeEspecie('Bovino')} ${renderBadgeEspecie('Caprino')}<\u002Ftd><\u002Ftr>\n                <tr><td><strong>Sítio Vale Verde<\u002Fstrong><\u002Ftd><td>Independência/CE<\u002Ftd><td>85<\u002Ftd><td>${renderBadgeEspecie('Ovino')} ${renderBadgeEspecie('Caprino')}<\u002Ftd><\u002Ftr>\n              <\u002Ftbody>\n            <\u002Ftable>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"card\">\n          <div class=\"section-title\">Preferências de notificação<\u002Fdiv>\n          <div class=\"col\" style=\"gap:6px;\">\n            <div style=\"display:flex;justify-content:space-between;font-size:12px;\"><span>Alertas de ciclo reprodutivo<\u002Fspan><span style=\"color:var(--ok);font-weight:600;\">● ativo<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;font-size:12px;\"><span>Diagnósticos vencidos<\u002Fspan><span style=\"color:var(--ok);font-weight:600;\">● ativo<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;font-size:12px;\"><span>Novos resultados de IA<\u002Fspan><span style=\"color:var(--ok);font-weight:600;\">● ativo<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;font-size:12px;\"><span>Boletim mensal por e-mail<\u002Fspan><span style=\"color:var(--ink-3);font-weight:600;\">○ inativo<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"card\" style=\"border:1px solid var(--warn-bg);\">\n          <div class=\"section-title\" style=\"color:var(--warn);\"><i data-lucide=\"shield\" style=\"width:12px;height:12px;\"><\u002Fi> Meus dados (LGPD)<\u002Fdiv>\n          <p class=\"text-sm text-muted\" style=\"margin-bottom:8px;\">Conforme a Lei nº 13.709/2018, você pode exportar ou excluir seus dados a qualquer momento.<\u002Fp>\n          <div class=\"row\" style=\"flex-wrap:wrap;gap:6px;\">\n            <div class=\"btn btn-secondary\"><i data-lucide=\"download\" style=\"width:12px;height:12px;\"><\u002Fi> Exportar dados (JSON)<\u002Fdiv>\n            <div class=\"btn btn-danger\"><i data-lucide=\"trash-2\" style=\"width:12px;height:12px;\"><\u002Fi> Solicitar exclusão<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  `);\n  appendFoot(sheet, '09');\n}\n\n/* --- Helpers --- */\nlet __sheetCounter = 2;\nfunction makeSheet(name, sub, pgnum, anchor){\n  const sheet = document.createElement('section');\n  sheet.className = 'page-sheet';\n  __sheetCounter++;\n  sheet.id = 'slide-' + __sheetCounter;\n  if (anchor) sheet.setAttribute('data-anchor', anchor);\n  sheet.innerHTML = `\n    <div class=\"sheet-head\">\n      <div class=\"brand\"><div class=\"mark\"><i data-lucide=\"dna\" style=\"width:16px;height:16px;\"><\u002Fi><\u002Fdiv><div class=\"name\">AgroGen <span class=\"ia\">IA<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"page-label\">${name}<\u002Fdiv>\n      <div class=\"pg-num\">${pgnum}<\u002Fdiv>\n    <\u002Fdiv>\n  `;\n  document.getElementById('captures').appendChild(sheet);\n  return sheet;\n}\n\nfunction appendFoot(sheet, n){\n  const f = document.createElement('div');\n  f.className = 'doc-foot';\n  f.innerHTML = `<span><strong>AgroGen IA<\u002Fstrong> · Plataforma de Inseminação Artificial · Dados tratados conforme LGPD<\u002Fspan><span>${n}<\u002Fspan>`;\n  sheet.appendChild(f);\n}\n\n// No auto-print in PPTX mode.\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
