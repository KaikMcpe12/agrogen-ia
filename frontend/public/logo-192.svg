<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b4332"/>
      <stop offset="100%" stop-color="#2d6a4f"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8e9df"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="40" fill="url(#bgGrad)"/>
  <!-- Bovine head silhouette -->
  <ellipse cx="96" cy="105" rx="38" ry="34" fill="url(#iconGrad)"/>
  <!-- Ears -->
  <ellipse cx="62" cy="90" rx="12" ry="8" fill="url(#iconGrad)" transform="rotate(-20 62 90)"/>
  <ellipse cx="130" cy="90" rx="12" ry="8" fill="url(#iconGrad)" transform="rotate(20 130 90)"/>
  <!-- Horns -->
  <path d="M68 82 Q50 62 55 52" stroke="url(#iconGrad)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M124 82 Q142 62 137 52" stroke="url(#iconGrad)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Eyes -->
  <circle cx="83" cy="100" r="4" fill="#1b4332"/>
  <circle cx="109" cy="100" r="4" fill="#1b4332"/>
  <!-- Muzzle -->
  <ellipse cx="96" cy="118" rx="18" ry="11" fill="#b8d4c0"/>
  <circle cx="90" cy="117" r="3" fill="#1b4332"/>
  <circle cx="102" cy="117" r="3" fill="#1b4332"/>
  <!-- Circuit lines -->
  <line x1="54" y1="105" x2="40" y2="105" stroke="url(#iconGrad)" stroke-width="2" opacity="0.6"/>
  <line x1="40" y1="105" x2="40" y2="130" stroke="url(#iconGrad)" stroke-width="2" opacity="0.6"/>
  <circle cx="40" cy="130" r="3" fill="url(#iconGrad)" opacity="0.7"/>
  <line x1="138" y1="105" x2="152" y2="105" stroke="url(#iconGrad)" stroke-width="2" opacity="0.6"/>
  <line x1="152" y1="105" x2="152" y2="130" stroke="url(#iconGrad)" stroke-width="2" opacity="0.6"/>
  <circle cx="152" cy="130" r="3" fill="url(#iconGrad)" opacity="0.7"/>
</svg>
