<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b4332"/>
      <stop offset="100%" stop-color="#2d6a4f"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8e9df"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <!-- Bovine head silhouette -->
  <ellipse cx="256" cy="290" rx="100" ry="90" fill="url(#iconGrad)"/>
  <!-- Ears -->
  <ellipse cx="162" cy="250" rx="32" ry="22" fill="url(#iconGrad)" transform="rotate(-20 162 250)"/>
  <ellipse cx="350" cy="250" rx="32" ry="22" fill="url(#iconGrad)" transform="rotate(20 350 250)"/>
  <!-- Horns -->
  <path d="M180 225 Q132 168 144 140" stroke="url(#iconGrad)" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M332 225 Q380 168 368 140" stroke="url(#iconGrad)" stroke-width="10" fill="none" stroke-linecap="round"/>
  <!-- Eyes -->
  <circle cx="220" cy="277" r="11" fill="#1b4332"/>
  <circle cx="292" cy="277" r="11" fill="#1b4332"/>
  <!-- Muzzle -->
  <ellipse cx="256" cy="330" rx="50" ry="30" fill="#b8d4c0"/>
  <circle cx="238" cy="328" r="8" fill="#1b4332"/>
  <circle cx="274" cy="328" r="8" fill="#1b4332"/>
  <!-- Circuit lines -->
  <line x1="146" y1="290" x2="108" y2="290" stroke="url(#iconGrad)" stroke-width="4" opacity="0.6"/>
  <line x1="108" y1="290" x2="108" y2="350" stroke="url(#iconGrad)" stroke-width="4" opacity="0.6"/>
  <circle cx="108" cy="350" r="7" fill="url(#iconGrad)" opacity="0.7"/>
  <line x1="366" y1="290" x2="404" y2="290" stroke="url(#iconGrad)" stroke-width="4" opacity="0.6"/>
  <line x1="404" y1="290" x2="404" y2="350" stroke="url(#iconGrad)" stroke-width="4" opacity="0.6"/>
  <circle cx="404" cy="350" r="7" fill="url(#iconGrad)" opacity="0.7"/>
</svg>
